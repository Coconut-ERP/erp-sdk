<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đơn xin nghỉ</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1a1a2e; }
    h1 { font-size: 1.4rem; }
    form { display: grid; gap: .75rem; margin-bottom: 2rem; }
    label { display: grid; gap: .25rem; font-size: .9rem; }
    input, textarea, button { font: inherit; padding: .5rem; border: 1px solid #ccc; border-radius: 6px; }
    button { background: #1a1a2e; color: #fff; border: 0; cursor: pointer; }
    button:disabled { opacity: .5; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #eee; }
    .status { padding: .1rem .5rem; border-radius: 999px; font-size: .8rem; }
    .pending { background: #fff3cd; } .approved { background: #d1e7dd; } .rejected { background: #f8d7da; }
    #error { color: #b02a37; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Đơn xin nghỉ</h1>
  <p id="who">Đang xác thực…</p>
  <p id="error"></p>

  <form id="form" hidden>
    <label>Lý do
      <textarea name="reason" rows="2" required></textarea>
    </label>
    <label>Từ ngày
      <input type="date" name="from" required />
    </label>
    <label>Đến ngày
      <input type="date" name="to" required />
    </label>
    <button type="submit">Gửi đơn</button>
  </form>

  <h2 style="font-size:1.1rem">Đơn của tôi</h2>
  <table id="list" hidden>
    <thead><tr><th>Lý do</th><th>Từ</th><th>Đến</th><th>Trạng thái</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const MESSAGE_TYPE = "erp-miniapp:init-data";

    function initDataFromUrl() {
      for (const raw of [location.hash.slice(1), location.search.slice(1)]) {
        const value = new URLSearchParams(raw).get("erpInitData");
        if (value) return value;
      }
      return null;
    }

    function initDataFromHost(timeoutMs = 5000) {
      return new Promise((resolve) => {
        const timer = setTimeout(() => resolve(null), timeoutMs);
        window.addEventListener("message", function listener(event) {
          if (event.data && event.data.type === MESSAGE_TYPE && event.data.initData) {
            clearTimeout(timer);
            window.removeEventListener("message", listener);
            resolve(event.data.initData);
          }
        });
      });
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "X-Init-Data": window.erpInitData,
          ...options.headers,
        },
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || response.statusText);
      return body;
    }

    async function refresh() {
      const rows = await api("api/leaves");
      const tbody = document.querySelector("#list tbody");
      tbody.innerHTML = "";
      for (const row of rows) {
        const tr = document.createElement("tr");
        const status = row["Trạng thái"] || "pending";
        tr.innerHTML =
          "<td></td><td></td><td></td><td><span class='status'></span></td>";
        const cells = tr.querySelectorAll("td");
        cells[0].textContent = row["Lý do"] || "";
        cells[1].textContent = row["Từ ngày"] || "";
        cells[2].textContent = row["Đến ngày"] || "";
        const badge = tr.querySelector(".status");
        badge.textContent = status;
        badge.classList.add(status);
        tbody.appendChild(tr);
      }
      document.getElementById("list").hidden = false;
    }

    async function main() {
      window.erpInitData = initDataFromUrl() || (await initDataFromHost());
      if (!window.erpInitData) {
        document.getElementById("who").textContent = "";
        document.getElementById("error").textContent =
          "Không nhận được initData từ app chính. Mở app này từ trong ERP.";
        return;
      }

      const me = await api("api/me");
      document.getElementById("who").textContent =
        "Xin chào " + (me.displayName || me.fullName || me.email);
      document.getElementById("form").hidden = false;
      await refresh();

      document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.target;
        const button = form.querySelector("button");
        button.disabled = true;
        try {
          await api("api/leaves", {
            method: "POST",
            body: JSON.stringify({
              reason: form.reason.value,
              from: form.from.value,
              to: form.to.value,
            }),
          });
          form.reset();
          await refresh();
        } catch (error) {
          document.getElementById("error").textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    }

    main().catch((error) => {
      document.getElementById("error").textContent = error.message;
    });
  </script>
</body>
</html>
