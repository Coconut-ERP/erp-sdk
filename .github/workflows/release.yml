name: Release

# erp-sdk is never published to npm. A release is a tarball attached to a GitHub
# Release, which every package manager can install from a URL — including bun,
# which refuses to build a git dependency (it blocks lifecycle scripts, and does
# not install a git dep's devDependencies, so `prepare: tsup` cannot run).
#
#   git tag v0.3.0 && git push --follow-tags   → builds, verifies, publishes
#   Actions ▸ Release ▸ Run workflow           → dry run, tarball as an artifact
#
# The asset is always named `erp-sdk.tgz`, so only the tag varies in the URL:
#
#   .../releases/download/v0.3.0/erp-sdk.tgz   pinned — use this in package.json
#   .../releases/download/latest/erp-sdk.tgz   moving — re-pointed at every release
#
# `latest` is a real tag and a real Release that this workflow force-updates, so
# the URL never has to be edited. It is for `npm i -g` and throwaway scripts, not
# for an app's dependencies: package managers key their lockfile on the URL, so a
# moving one installs whatever it cached and stops being reproducible.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the `prepare` script, so this also builds dist/.
      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            echo "::error::run \`npm version $tag --no-git-tag-version\`, commit, then re-tag"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Renamed to a version-less asset name on purpose: the tag already carries
      # the version, and npm reads the real one from the package.json inside.
      - name: Pack
        id: pack
        run: |
          rm -f ./*.tgz
          npm pack
          mv "$(ls erp-sdk-*.tgz)" erp-sdk.tgz
          echo "tgz=erp-sdk.tgz" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "packed erp-sdk.tgz ($(du -h erp-sdk.tgz | cut -f1))"
          tar -tzf erp-sdk.tgz | head -20

      # The tarball is what consumers actually install, so smoke test *it* —
      # not the working tree. dist/ must be present and both module formats
      # must resolve, with no build step on the consumer's side.
      - name: Smoke test with npm
        run: |
          tgz="$PWD/${{ steps.pack.outputs.tgz }}"
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y > /dev/null
          npm install "$tgz"
          node -e "import('erp-sdk').then(m => { if (typeof m.createMiniApp !== 'function') throw new Error('missing ESM export'); console.log('npm esm ok') })"
          node -e "if (typeof require('erp-sdk').createMiniApp !== 'function') throw new Error('missing CJS export'); console.log('npm cjs ok')"
          test -f node_modules/erp-sdk/dist/index.d.ts || { echo "missing types"; exit 1; }
          ./node_modules/.bin/erp help --json > /dev/null && echo "npm cli ok"

      - name: Smoke test with bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          tgz="$PWD/${{ steps.pack.outputs.tgz }}"
          dir="$(mktemp -d)"
          cd "$dir"
          echo '{"name":"smoke","type":"module"}' > package.json
          bun add "file:$tgz"
          bun -e "import { createMiniApp } from 'erp-sdk'; if (typeof createMiniApp !== 'function') throw new Error('missing ESM export'); console.log('bun esm ok')"
          ./node_modules/.bin/erp help --json > /dev/null && echo "bun cli ok"

      - name: Upload the tarball as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-sdk-${{ steps.pack.outputs.version }}.tgz
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download"
          url="$base/${GITHUB_REF_NAME}/erp-sdk.tgz"
          moving="$base/latest/erp-sdk.tgz"
          cat > notes.md <<EOF
          Not published to npm — install the tarball below with any package manager.

          \`\`\`bash
          npm install $url
          bun add $url
          pnpm add $url
          yarn add $url
          \`\`\`

          In \`package.json\`:

          \`\`\`json
          { "dependencies": { "erp-sdk": "$url" } }
          \`\`\`

          The same build is also served from a URL that never changes:
          \`$moving\`. Handy for \`npm i -g\` and one-off scripts; keep the pinned
          URL above in an app's dependencies, since package managers key their
          lockfile on the URL and a moving one is not reproducible.
          EOF
          gh release create "$GITHUB_REF_NAME" erp-sdk.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --latest
          echo "published $url"

      # A moving pointer, so a fresh machine can install without editing a URL.
      # The tag is force-updated first: `gh release create` would otherwise open
      # `latest` on the default branch head rather than on the tagged commit.
      - name: Re-point the `latest` release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push -f origin "$GITHUB_SHA:refs/tags/latest"

          cat > notes-latest.md <<EOF
          Always the newest release — currently **$GITHUB_REF_NAME**.

          \`\`\`bash
          npm install -g https://github.com/${{ github.repository }}/releases/download/latest/erp-sdk.tgz
          \`\`\`

          This asset is replaced on every release, so an install from it is not
          reproducible: package managers cache and lock by URL. Pin
          [$GITHUB_REF_NAME](https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME)
          in an app's \`package.json\`.
          EOF

          # `--latest=false` keeps the version release wearing the "Latest" badge.
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest erp-sdk.tgz --clobber
            gh release edit latest --title "latest ($GITHUB_REF_NAME)" \
              --notes-file notes-latest.md --latest=false
          else
            gh release create latest erp-sdk.tgz --title "latest ($GITHUB_REF_NAME)" \
              --notes-file notes-latest.md --latest=false
          fi
          echo "re-pointed https://github.com/${{ github.repository }}/releases/download/latest/erp-sdk.tgz at $GITHUB_REF_NAME"
